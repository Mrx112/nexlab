<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexLab — Lab Jaringan Pribadi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='6' fill='%231F6FB5'/%3E%3Ccircle cx='10' cy='11' r='3.2' fill='%23fff'/%3E%3Ccircle cx='22' cy='11' r='3.2' fill='%23fff'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='%23fff'/%3E%3Cpath d='M10 11L22 11L16 22Z' fill='none' stroke='%23fff' stroke-width='1.4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/css/app.css?v=pnet13">
<script type="importmap">{"imports":{"three":"/static/vendor/three.module.min.js","three/addons/":"/static/vendor/addons/"}}</script>
</head>
<body>

<!-- ============ AUTH ============ -->
<section id="auth" class="hidden">
  <label class="language-control auth-language" aria-label="Language">
    <span>Language</span>
    <select data-language-select>
      <option value="en">English</option>
      <option value="id">Bahasa Indonesia</option>
    </select>
  </label>
  <div class="auth-box">
    <div class="auth-logo">
      <svg class="brand-mark lg" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="6" fill="#1F6FB5"/><circle cx="10" cy="11" r="3.2" fill="#fff"/><circle cx="22" cy="11" r="3.2" fill="#fff"/><circle cx="16" cy="22" r="3.2" fill="#fff"/><path d="M10 11L22 11L16 22Z" fill="none" stroke="#fff" stroke-width="1.2"/></svg>
      <div><div class="auth-title" id="brandTitle">NexLab</div><div class="auth-sub">Network Emulator Lab</div></div>
    </div>
    <div class="tabs" role="tablist">
      <button id="tabLogin" class="act" role="tab">Login</button>
      <button id="tabReg" role="tab">Daftar</button>
    </div>
    <form id="fLogin">
      <div class="field ico"><label for="lu">Username</label><span class="fi" data-ico="user"></span><input class="input" id="lu" autocomplete="username" placeholder="Username" required></div>
      <div class="field ico"><label for="lp">Password</label><span class="fi" data-ico="lock"></span><input class="input" id="lp" type="password" autocomplete="current-password" placeholder="Password" required></div>
      <label class="check"><input type="checkbox" id="lr" checked> Ingat saya 30 hari</label>
      <div class="err" id="lerr"></div>
      <button class="btn primary block">Login</button>
    </form>
    <form id="fReg" class="hidden">
      <div class="field"><label for="rn">Nama lengkap</label><input class="input" id="rn" autocomplete="name"></div>
      <div class="field"><label for="ru">Username</label><input class="input" id="ru" autocomplete="username" required pattern="[a-z0-9_.\-]{3,32}" title="3-32 karakter: huruf kecil, angka, . _ -"></div>
      <div class="field"><label for="rp">Password</label><input class="input" id="rp" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="field"><label for="rp2">Ulangi password</label><input class="input" id="rp2" type="password" minlength="6" autocomplete="new-password" required></div>
      <div class="err" id="rerr"></div>
      <button class="btn primary block">Buat akun</button>
    </form>
    <p class="auth-note" id="authNote"></p>
  </div>
  <p class="auth-foot">NexLab — lab jaringan di browser: router, switch, firewall, PC, QEMU &amp; perangkat fisik.</p>
</section>

<!-- ============ APP SHELL ============ -->
<section id="shell" class="hidden">
  <header class="topbar">
    <div class="brand"><svg class="brand-mark" viewBox="0 0 32 32"><rect x="2" y="2" width="28" height="28" rx="6" fill="#fff"/><circle cx="10" cy="11" r="3.2" fill="#1F6FB5"/><circle cx="22" cy="11" r="3.2" fill="#1F6FB5"/><circle cx="16" cy="22" r="3.2" fill="#1F6FB5"/><path d="M10 11L22 11L16 22Z" fill="none" stroke="#1F6FB5" stroke-width="1.2"/></svg><span class="appTitle">NexLab</span></div>
    <nav class="nav">
      <a href="#/labs" data-nav="labs" data-ico="home">Main</a>
      <a href="#/system" data-nav="system" data-ico="gauge">Status sistem</a>
      <a href="#/users" data-nav="users" data-ico="users" class="admin-only">Manajemen user</a>
      <a href="#/help" data-nav="help" data-ico="help">Panduan</a>
      <a href="#/donate" data-nav="donate" data-ico="gift">Donasi</a>
    </nav>
    <label class="language-control app-language" aria-label="Language">
      <span>Language</span>
      <select data-language-select>
        <option value="en">English</option>
        <option value="id">Bahasa Indonesia</option>
      </select>
    </label>
    <div class="user-chip">
      <button class="user-btn" id="avatarBtn" title="Akun"><span class="avatar" data-ico="user"></span><span id="whoami"></span><span class="car" data-ico="caret"></span></button>
    </div>
  </header>
  <main id="view" class="page"></main>
</section>

<div id="toasts" aria-live="polite"></div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/js/icons.js?v=pnet3"></script>
<script src="/static/js/console.js?v=pnet3"></script>
<script src="/static/js/guide-data.js?v=pnet3"></script>
<script src="/static/js/guide.js?v=pnet3"></script>
<script src="/static/js/editor.js?v=pnet3"></script>
<script src="/static/js/editor-plus.js?v=pnet3"></script>
<script src="/static/js/i18n.js?v=pnet13"></script>
<script src="/static/js/app.js?v=pnet13"></script>
</body>
</html>
