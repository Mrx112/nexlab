name: Build and publish desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows x64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q run.py server scripts
      - name: Build application
        run: python scripts/build-app.py
      - name: Verify packaged application
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\NexLab\NexLab.exe")) { throw "NexLab.exe was not built." }
          if (-not (Test-Path "dist\NexLab\_internal\static\index.html")) { throw "Packaged static/index.html is missing." }
      - name: Package release
        shell: pwsh
        run: Compress-Archive -Path "dist\NexLab\*" -DestinationPath "NexLab-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: NexLab-Windows-x64.zip
          if-no-files-found: error

  macos:
    name: Build macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-arm64
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q run.py server scripts
      - name: Build application bundle
        run: python scripts/build-app.py
      - name: Verify packaged application
        run: |
          test -x dist/NexLab.app/Contents/MacOS/nexlab-launcher
          test -x dist/NexLab.app/Contents/Resources/runtime/NexLab
          test -f dist/NexLab.app/Contents/Resources/runtime/_internal/static/index.html
      - name: Package release
        run: tar -czf "NexLab-macOS-${{ matrix.arch }}.tar.gz" -C dist NexLab.app
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: NexLab-macOS-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q run.py server scripts
      - name: Build application
        run: python scripts/build-app.py
      - name: Verify packaged application
        run: |
          test -x dist/NexLab/NexLab
          test -f dist/NexLab/_internal/static/index.html
      - name: Package release
        run: tar -czf NexLab-Linux-x64.tar.gz -C dist NexLab
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: NexLab-Linux-x64.tar.gz
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Add platform installers and checksums
        run: |
          set -euo pipefail
          cp installers/windows/setup.cmd release-assets/NexLab-Setup-Windows.cmd
          cp installers/windows/install.ps1 release-assets/NexLab-Install-Windows.ps1
          cp installers/macos/install.command release-assets/NexLab-Setup-macOS.command
          cp installers/linux/install.sh release-assets/NexLab-Setup-Linux.sh
          chmod +x release-assets/NexLab-Setup-macOS.command release-assets/NexLab-Setup-Linux.sh
          cd release-assets
          sha256sum NexLab-Windows-x64.zip NexLab-macOS-arm64.tar.gz NexLab-macOS-x64.tar.gz NexLab-Linux-x64.tar.gz NexLab-Install-Windows.ps1 NexLab-Setup-Windows.cmd NexLab-Setup-macOS.command NexLab-Setup-Linux.sh > NexLab-SHA256SUMS.txt
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: NexLab ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
